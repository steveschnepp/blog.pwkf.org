<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <!-- 100% privacy-first analytics -->
    <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt="" referrerpolicy="no-referrer-when-downgrade"/></noscript>
    <a href="https://www.simpleanalytics.com?utm_source=blog.pwkf.org&utm_content=badge" referrerpolicy="origin" target="_blank">
      <picture>
        <source
          srcset="https://simpleanalyticsbadges.com/blog.pwkf.org?mode=dark"
          media="(prefers-color-scheme: dark)"
        />
        <img
          src="https://simpleanalyticsbadges.com/blog.pwkf.org?mode=light"
          loading="lazy"
          referrerpolicy="no-referrer"
          crossorigin="anonymous"
        />
      </picture>
    </a>

  </body>

</html>
